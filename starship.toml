format = "${custom.machine}$directory$git_branch$git_status$line_break$character"

[custom.machine]
when = true
shell = ["sh"]
command = '''if [ -n "${SSH_CONNECTION:-}${SSH_CLIENT:-}${SSH_TTY:-}${PROMPT_PURE_SSH_CONNECTION:-}" ]; then printf '☁️ '; else printf '💻'; fi'''
format = "$output "

[directory]
style = "purple"
truncate_to_repo = false
truncation_length = 0

[git_branch]
format = "[$branch]($style) "
style = "bright-black"

[git_status]
disabled = true

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
