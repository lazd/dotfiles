format = "${env_var.STARSHIP_SESSION_ICON}$directory$git_branch$git_status$line_break$character"

[env_var.STARSHIP_SESSION_ICON]
format = "$env_value "

[directory]
style = "purple"
truncate_to_repo = false
truncation_length = 0

[git_branch]
format = "[$branch]($style) "
style = "bright-black"

[git_status]
disabled = true

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
